            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .mapel:hover {
            background: #1e40af;
        }

            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #2563eb;
        }

            font-weight: bold;
            color: #475569;
        }

        #pertanyaan {

            font-weight: bold;
            margin-top: 20px;
        }

        .jawaban {

            background: #dbeafe;

            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #lanjut {
            background: #16a34a;
        }

        #ulang {
            background: #2563eb;
        }

        #ganti {
            background: #64748b;
        }

        #hasil {

            font-weight: bold;

                }
            });

            if (index === jawabanBenar) {
                tombolDipilih.classList.add("benar");
                skor++;
            } else {
                tombolDipilih.classList.add("salah");
            }
        }

        document.getElementById("lanjut")
            .addEventListener("click", function() {
                soalBerikutnya();
            });

        function soalBerikutnya() {
            if (!sudahMenjawab) {
                alert("Pilih jawaban terlebih dahulu!");
                return;
            }

            nomorSekarang++;

            if (nomorSekarang < soalAktif.length) {
                tampilkanSoal();
            } else {
                tampilkanHasil();
            }
        }

        function tampilkanHasil() {
            quiz.style.display = "none";

            const nilai = Math.round(
                (skor / soalAktif.length) * 100
            );

            hasil.innerHTML =
                "Quiz selesai!<br><br>" +
                "Mata Pelajaran: " + mapelSekarang +
                "<br>Jawaban benar: " + skor +
                " dari " + soalAktif.length +
                "<br>Nilai: " + nilai;

            ulang.style.display = "block";
        }

        ulang.addEventListener("click", function() {
            mulaiQuiz(mapelSekarang);
        });

        document.getElementById("ganti")
            .addEventListener("click", function() {
                quiz.style.display = "none";
                hasil.innerHTML = "";
                ulang.style.display = "none";
                menuMapel.style.display = "block";
            });
    </script>
</body>
</html>
