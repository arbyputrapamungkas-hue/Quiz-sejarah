        body {

        }

        .mapel {

            margin: 8px 0;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;

        }

            font-size: 20px;

            color: #1e293b;
            line-height: 1.5;
            margin-top: 25px;
        }

        .jawaban {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #dbeafe;
            color: #1e293b;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .jawaban:hover {
            background: #93c5fd;
        }

        .jawaban:disabled {
            cursor: not-allowed;
        }

        .benar {
            background: #86efac !important;
            border-color: #15803d;
        }

        .salah {
            background: #fca5a5 !important;
            border-color: #b91c1c;
        }

        .tombol {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tombol:hover {
            opacity: 0.85;
        }

        #lanjut {
            background: #16a34a;
        }

        #ganti {
            background: #64748b;
        }

        #ulang {
            background: #2563eb;
        }

        #hasil {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.7;
            color: #166534;
            margin-top: 20px;
        }

        .keterangan {
            text-align: center;
            color: #475569;
            margin-top: 20px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            #pertanyaan {
                font-size: 18px;
            }

            .header-kuis {
                display: block;
            }

            #skor-sementara {

        let mapelSekarang = "";
        let soalAktif = [];
        let nomorSekarang = 0;
        let skor = 0;
        let sudahMenjawab = false;


        const namaMapel = Object.keys(bankSoal);


        function tampilkanMenuMapel() {
            const daftarMapel =
                document.getElementById("daftar-mapel");

            daftarMapel.innerHTML = "";

            namaMapel.forEach(function(nama) {
                const tombol = document.createElement("button");

                tombol.textContent = nama;
                tombol.className = "mapel";

                tombol.onclick = function() {
                    mulaiQuiz(nama);
                };

                daftarMapel.appendChild(tombol);
            });
        }


        function mulaiQuiz(nama) {
            mapelSekarang = nama;
            soalAktif = bankSoal[nama];

            nomorSekarang = 0;
            skor = 0;
            sudahMenjawab = false;

            document.getElementById("menu-mapel").style.display = "none";
            document.getElementById("quiz").style.display = "block";
            document.getElementById("hasil").innerHTML = "";
            document.getElementById("ulang").style.display = "none";

            document.getElementById("nama-mapel").textContent =
                "Mapel: " + mapelSekarang;

            tampilkanSoal();
        }


        function tampilkanSoal() {
            const data = soalAktif[nomorSekarang];

            document.getElementById("nomor").textContent =
                "Soal " +
                (nomorSekarang + 1) +
                " dari " +
                soalAktif.length;

            document.getElementById("skor-sementara").textContent =
                "Skor: " + skor;

            document.getElementById("pertanyaan").textContent =
                data[0];

            const daftarJawaban =
                document.getElementById("daftar-jawaban");

            daftarJawaban.innerHTML = "";

            sudahMenjawab = false;

            data[1].forEach(function(pilihan, index) {
                const tombol = document.createElement("button");

                tombol.textContent =
                    String.fromCharCode(65 + index) +
                    ". " +
                    pilihan;

                tombol.className = "jawaban";

                tombol.onclick = function() {
                    periksaJawaban(index, tombol);
                };

                daftarJawaban.appendChild(tombol);
            });

            if (nomorSekarang === soalAktif.length - 1) {
                document.getElementById("lanjut").textContent =
                    "Lihat Hasil";
            } else {
                document.getElementById("lanjut").textContent =
                    "Soal Berikutnya";
            }
        }


        function periksaJawaban(index, tombolDipilih) {
            if (sudahMenjawab) {
                return;
            }

            sudahMenjawab = true;

            const jawabanBenar =
                soalAktif[nomorSekarang][2];

            const semuaJawaban =
                document.querySelectorAll(".jawaban");

            semuaJawaban.forEach(function(tombol, posisi) {
                tombol.disabled = true;

                if (posisi === jawabanBenar) {
                    tombol.classList.add("benar");
                }
            });

            if (index === jawabanBenar) {
                tombolDipilih.classList.add("benar");
                skor++;
            } else {
                tombolDipilih.classList.add("salah");
            }

            document.getElementById("skor-sementara").textContent =
                "Skor: " + skor;
        }


        function soalBerikutnya() {
            if (!sudahMenjawab) {
                alert("Pilih jawaban terlebih dahulu!");
                return;
            }

            nomorSekarang++;

            if (nomorSekarang < soalAktif.length) {
                tampilkanSoal();
            } else {
                tampilkanHasil();
            }
        }


        function tampilkanHasil() {
            document.getElementById("quiz").style.display = "none";

            const nilai =
                Math.round((skor / soalAktif.length) * 100);

            let pesan = "";

            if (nilai >= 90) {
                pesan = "Sangat baik!";
            } else if (nilai >= 75) {
                pesan = "Bagus, terus belajar!";
            } else if (nilai >= 60) {
                pesan = "Cukup baik, tetap semangat!";
            } else {
                pesan = "Jangan menyerah, coba lagi!";
            }

            document.getElementById("hasil").innerHTML =
                "Quiz Selesai!<br><br>" +
                "Mata pelajaran: " + mapelSekarang +
                "<br>Jawaban benar: " +
                skor +
                " dari " +
                soalAktif.length +
                "<br>Nilai: " +
                nilai +
                "<br><br>" +
                pesan;

            document.getElementById("ulang").style.display = "block";
        }


        function ulangQuiz() {
            mulaiQuiz(mapelSekarang);
        }


        function gantiMapel() {
            document.getElementById("quiz").style.display = "none";

            document.getElementById("ulang").style.display = "none";
            document.getElementById("menu-mapel").style.display = "block";
