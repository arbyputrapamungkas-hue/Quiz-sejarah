<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Sejarah Indonesia</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1d4ed8, #0f172a);
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #475569;
            font-weight: bold;
        }

        .progress-background {
            width: 100%;
            height: 10px;
            margin-bottom: 25px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: 0.3s;
        }

        .question-box {
            padding: 20px;
            background: #eff6ff;
            border-radius: 15px;
        }

        #question {
            margin-bottom: 20px;
            color: #1e293b;
            font-size: 20px;
            line-height: 1.5;
        }

        .option {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            color: #1e293b;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #2563eb;
            background: #dbeafe;
        }

        .option.correct {
            border-color: #16a34a;
            background: #bbf7d0;
        }

        .option.wrong {
            border-color: #dc2626;
            background: #fecaca;
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            text-align: center;
        }

        #result h2 {
            margin-bottom: 15px;
            color: #16a34a;
        }

        #result p {
            margin: 10px;
            color: #334155;
            font-size: 18px;
        }

        .medal {
            margin: 15px 0;
            font-size: 50px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 18px;
            }

            #question {
                font-size: 18px;
            }

            .option {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Quiz Sejarah Indonesia</h1>
            <p>Uji pengetahuan sejarahmu!</p>
        </div>

        <div id="quiz">

            <div class="info">
                <span id="question-number">Soal 1 dari 10</span>
                <span id="score">Skor: 0</span>
            </div>

            <div class="progress-background">
                <div id="progress" class="progress"></div>
            </div>

            <div class="question-box">
                <h2 id="question"></h2>
                <div id="options"></div>
            </div>

            <button id="next-button" class="button" onclick="nextQuestion()">
                Soal Berikutnya
            </button>

        </div>

        <div id="result">
            <div class="medal">🏆</div>

            <h2>Quiz Selesai!</h2>

            <p id="final-score"></p>
            <p id="final-value"></p>
            <p id="message"></p>
            <p id="best-score"></p>

            <button class="button" onclick="restartQuiz()">
                Ulangi Quiz
            </button>
        </div>

    </div>

    <script>
        const questions = [
            {
                question: "Kapan Indonesia memproklamasikan kemerdekaannya?",
                options: [
                    "20 Mei 1908",
                    "28 Oktober 1928",
                    "17 Agustus 1945",
                    "10 November 1945"
                ],
                answer: 2
            },

            {
                question: "Siapa yang membacakan teks Proklamasi?",
                options: [
                    "Soekarno",
                    "Mohammad Hatta",
                    "Ahmad Soebardjo",
                    "Sayuti Melik"
                ],
                answer: 0
            },

            {
                question: "Sumpah Pemuda diperingati setiap tanggal ...",
                options: [
                    "20 Mei",
                    "28 Oktober",
                    "17 Agustus",
                    "10 November"
                ],
                answer: 1
            },

            {
                question: "Organisasi yang menjadi awal Kebangkitan Nasional adalah ...",
                options: [
                    "Budi Utomo",
                    "PNI",
                    "Sarekat Islam",
                    "Indische Partij"
                ],
                answer: 0
            },

            {
                question: "Siapa yang mengetik teks Proklamasi?",
                options: [
                    "Soekarno",
                    "Sayuti Melik",
                    "Mohammad Hatta",
                    "Wikana"
                ],
                answer: 1
            },

            {
                question: "Kongres Pemuda II menghasilkan ...",
                options: [
                    "Pancasila",
                    "UUD 1945",
                    "Sumpah Pemuda",
                    "Dekret Presiden"
                ],
                answer: 2
            },

            {
                question: "Di mana Proklamasi Kemerdekaan dibacakan?",
                options: [
                    "Jalan Imam Bonjol No. 1",
                    "Jalan Pegangsaan Timur No. 56",
                    "Istana Merdeka",
                    "Gedung Pancasila"
                ],
                answer: 1
            },

            {
                question: "Siapa pencipta lagu Indonesia Raya?",
                options: [
                    "Ismail Marzuki",
                    "W.R. Supratman",
                    "C. Simanjuntak",
                    "Kusbini"
                ],
                answer: 1
            },

            {
                question: "Tanggal 10 November diperingati sebagai Hari ...",
                options: [
                    "Pendidikan Nasional",
                    "Kebangkitan Nasional",
                    "Pahlawan",
                    "Kesaktian Pancasila"
                ],
                answer: 2
            },

            {
                question: "Peristiwa Rengasdengklok bertujuan untuk ...",
                options: [
                    "Menyerang Belanda",
                    "Mendesak Soekarno-Hatta segera memproklamasikan kemerdekaan",
                    "Membentuk organisasi baru",
                    "Mengadakan pemilu"
                ],
                answer: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionNumber = document.getElementById("question-number");
        const scoreText = document.getElementById("score");
        const progress = document.getElementById("progress");
        const questionText = document.getElementById("question");
        const optionsContainer = document.getElementById("options");
        const nextButton = document.getElementById("next-button");

        function showQuestion() {
            const data = questions[currentQuestion];

            answered = false;

            questionNumber.textContent =
                "Soal " + (currentQuestion + 1) +
                " dari " + questions.length;

            scoreText.textContent = "Skor: " + score;

            progress.style.width =
                ((currentQuestion + 1) / questions.length * 100) + "%";

            questionText.textContent = data.question;

            optionsContainer.innerHTML = "";

            data.options.forEach(function(option, index) {
                const button = document.createElement("button");

                button.className = "option";
                button.textContent =
                    String.fromCharCode(65 + index) + ". " + option;

                button.onclick = function() {
                    checkAnswer(index, button);
                };

                optionsContainer.appendChild(button);
            });

            if (currentQuestion === questions.length - 1) {
                nextButton.textContent = "Lihat Hasil";
            } else {
                nextButton.textContent = "Soal Berikutnya";
            }
        }

        function checkAnswer(selectedIndex, selectedButton) {
            if (answered) {
                return;
            }

            answered = true;

            const correctIndex = questions[currentQuestion].answer;
            const allOptions = document.querySelectorAll(".option");

            allOptions.forEach(function(button, index) {
                button.disabled = true;

                if (index === correctIndex) {
                    button.classList.add("correct");
                }
            });

            if (selectedIndex === correctIndex) {
                selectedButton.classList.add("correct");
                score++;
                scoreText.textContent = "Skor: " + score;
            } else {
                selectedButton.classList.add("wrong");
            }
        }

        function nextQuestion() {
            if (!answered) {
                alert("Pilih jawaban terlebih dahulu!");
                return;
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz").style.display = "none";
            document.getElementById("result").style.display = "block";

            const value = Math.round((score / questions.length) * 100);

            document.getElementById("final-score").textContent =
                "Jawaban benar: " + score + " dari " + questions.length;

            document.getElementById("final-value").textContent =
                "Nilai kamu: " + value;

            if (value >= 80) {
                document.getElementById("message").textContent =
                    "Sangat bagus! Pengetahuan sejarahmu hebat.";
            } else if (value >= 60) {
                document.getElementById("message").textContent =
                    "Cukup bagus! Tetap semangat belajar.";
            } else {
                document.getElementById("message").textContent =
                    "Jangan menyerah. Pelajari sejarah lebih giat lagi.";
            }

            const oldBest = localStorage.getItem("bestScore") || 0;

            if (value > oldBest) {
                localStorage.setItem("bestScore", value);
            }

            document.getElementById("best-score").textContent =
                "Nilai terbaik: " +
                localStorage.getItem("bestScore") +
                " poin";
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;

            document.getElementById("quiz").style.display = "block";
            document.getElementById("result").style.display = "none";

            showQuestion();
        }

        showQuestion();
    </script>

</body>
</html>
